<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pârâu la Pițu - Rezervare Demo</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: linear-gradient(135deg, #6a0dad, #b85cff);
color: white;
}

.container {
max-width: 700px;
margin: 40px auto;
padding: 30px;
background: #5b168f;
border-radius: 25px;
box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1 {
text-align: center;
color: #ff69b4;
font-size: 38px;
}

h2 {
color: #ff8acb;
}

label {
display: block;
margin-top: 15px;
margin-bottom: 6px;
color: #ffb6df;
font-weight: bold;
}

input, select {
width: 100%;
padding: 12px;
box-sizing: border-box;
border: none;
border-radius: 10px;
font-size: 16px;
}

button {
width: 100%;
margin-top: 25px;
padding: 14px;
border: none;
border-radius: 12px;
background: #ff69b4;
color: white;
font-size: 18px;
font-weight: bold;
cursor: pointer;
}

button:hover {
background: #ff1493;
}

.demo {
margin-top: 20px;
padding: 12px;
background: #43106b;
border-radius: 10px;
font-size: 13px;
}

#ticket {
display: none;
margin-top: 30px;
padding: 25px;
background: white;
color: #42105f;
border-radius: 20px;
}

#ticket h2 {
color: #9b2fcf;
}

.ticket-row {
margin: 10px 0;
}

.boarding {
margin-top: 20px;
padding: 15px;
background: #f3d9ff;
border-radius: 10px;
text-align: center;
font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>💗 Pârâu la Pițu 💜</h1>

<h2>Rezervare zbor</h2>

<label>Plecare</label>
<input id="plecare" type="text" placeholder="Ex: Londra">

<label>Destinație</label>
<input id="destinatie" type="text" placeholder="Ex: București">

<label>Data zborului</label>
<input id="data" type="date">

<label>Avion</label>
<select id="avion">
<option>Airbus A321neo</option>
<option>Airbus A350</option>
<option>Boeing 777</option>
</select>

<label>Nume</label>
<input id="nume" type="text" placeholder="Nume">

<label>Prenume</label>
<input id="prenume" type="text" placeholder="Prenume">

<label>Fotografie demo</label>
<input id="poza" type="file" accept="image/*">

<label>Clasă</label>
<select id="clasa">
<option>Economy Class</option>
<option>Business Class</option>
<option>First Class</option>
</select>

<label>Loc</label>
<select id="seat">
<option>12A</option>
<option>12B</option>
<option>14A</option>
<option>18C</option>
<option>24F</option>
</select>

<div class="demo">
⚠️ DEMO: Nu încărca pașaportul, permisul sau alte documente reale.
Această pagină este doar un proiect fictiv.
</div>

<button onclick="continuare()">Continuare</button>

<div id="ticket">

<h2>✈️ Bilet Pârâu la Pițu</h2>

<div class="ticket-row">
<strong>Pasager:</strong>
<span id="tPasager"></span>
</div>

<div class="ticket-row">
<strong>De la:</strong>
<span id="tPlecare"></span>
</div>

<div class="ticket-row">
<strong>La:</strong>
<span id="tDestinatie"></span>
</div>

<div class="ticket-row">
<strong>Data:</strong>
<span id="tData"></span>
</div>

<div class="ticket-row">
<strong>Avion:</strong>
<span id="tAvion"></span>
</div>

<div class="ticket-row">
<strong>Clasă:</strong>
<span id="tClasa"></span>
</div>

<div class="ticket-row">
<strong>Seat:</strong>
<span id="tSeat"></span>
</div>

<div class="ticket-row">
<strong>Preț demo:</strong>
<span>£249.99</span>
</div>

<div class="boarding">
CHECK-IN COMPLETAT ✅<br><br>
Boarding Pass DEMO
</div>

</div>

</div>

<script>

function continuare() {

const nume = document.getElementById("nume").value.trim();
const prenume = document.getElementById("prenume").value.trim();
const plecare = document.getElementById("plecare").value.trim();
const destinatie = document.getElementById("destinatie").value.trim();
const data = document.getElementById("data").value;

if (!nume || !prenume || !plecare || !destinatie || !data) {
alert("Te rog completează toate câmpurile obligatorii.");
return;
}

document.getElementById("tPasager").textContent =
prenume + " " + nume;

document.getElementById("tPlecare").textContent =
plecare;

document.getElementById("tDestinatie").textContent =
destinatie;

document.getElementById("tData").textContent =
data;

document.getElementById("tAvion").textContent =
document.getElementById("avion").value;

document.getElementById("tClasa").textContent =
document.getElementById("clasa").value;

document.getElementById("tSeat").textContent =
document.getElementById("seat").value;

document.getElementById("ticket").style.display = "block";
}

</script>

</body>
</html>
